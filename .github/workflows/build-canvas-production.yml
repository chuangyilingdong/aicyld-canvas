name: Build Canvas production artifacts

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version (default: VERSION + -ci)"
        required: false
        type: string
  push:
    branches:
      - codex/canvas-billing-ui-20261104
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: canvas-production-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux amd64 backend and hosted web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          version="${{ inputs.build_version }}"
          if [[ -z "$version" ]]; then
            version="$(tr -d '\r\n' < VERSION)-ci"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build hosted web
        working-directory: web
        env:
          CANVAS_BUILD_VERSION: ${{ steps.version.outputs.value }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: bun --bun ./node_modules/vite/bin/vite.js build

      - name: Build Linux backend
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          mkdir -p ../out
          ldflags="-s -w -X infinite-canvas/backend/internal/buildinfo.Version=${{ steps.version.outputs.value }} -X infinite-canvas/backend/internal/buildinfo.Commit=${{ github.sha }} -X infinite-canvas/backend/internal/buildinfo.BuildTime=${{ steps.version.outputs.time }}"
          go build -trimpath -ldflags="$ldflags" -o ../out/infinite-canvas-backend ./cmd/server
          chmod 0755 ../out/infinite-canvas-backend

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/web-dist.tar.gz -C web/dist .
          cat > out/build-manifest.json <<EOF
          {
            "format": "aicyld-canvas-linux-build-v1",
            "version": "${{ steps.version.outputs.value }}",
            "commit": "${{ github.sha }}",
            "buildTime": "${{ steps.version.outputs.time }}",
            "backend": "infinite-canvas-backend",
            "web": "web-dist.tar.gz"
          }
          EOF
          (cd out && sha256sum infinite-canvas-backend web-dist.tar.gz build-manifest.json > SHA256SUMS)
          file out/infinite-canvas-backend
          ls -lh out

      - name: Smoke-test built artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f out/infinite-canvas-backend
          test -f out/web-dist.tar.gz
          test -f out/build-manifest.json
          tar -tzf out/web-dist.tar.gz > "$RUNNER_TEMP/web-dist.list"
          grep -Eq "(^|/)index.html$" "$RUNNER_TEMP/web-dist.list"
          data_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/backend-smoke.log"
          CANVAS_BACKEND_ADDR=127.0.0.1:18080 \
            CANVAS_BACKEND_DATA_DIR="$data_dir" \
            CANVAS_AUTO_MIGRATE=true \
            CANVAS_DISABLE_WORKERS=true \
            CANVAS_REGISTRATION_ENABLED=false \
            ./out/infinite-canvas-backend >"$log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/health.json"
          grep -q '"ready":true' "$RUNNER_TEMP/health.json"
          cleanup
          trap - EXIT
          echo "smoke=ok"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicyld-canvas-linux-amd64-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
