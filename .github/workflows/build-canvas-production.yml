name: Build Canvas production release

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version (default: RELEASE_VERSION or VERSION-ci)"
        required: false
        type: string
  push:
    branches:
      - codex/canvas-billing-ui-20261104
      - codex/canvas-gpt-image-26-20261106
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: canvas-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Linux amd64 release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build metadata
        id: version
        shell: bash
        run: |
          version="${{ inputs.build_version }}"
          if [[ -z "$version" && -f RELEASE_VERSION ]]; then
            version="$(tr -d '\r\n' < RELEASE_VERSION)"
          fi
          if [[ -z "$version" ]]; then
            version="$(tr -d '\r\n' < VERSION)-ci"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          printf 'short=%s\n' "${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Agent Host Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun --bun ./node_modules/typescript/bin/tsc --noEmit

      - name: Run focused web regression tests
        working-directory: web
        run: >-
          bun test
          test/moderation-error.test.ts
          test/generation-failure-actions.test.tsx
          test/task-outcome.test.ts
          test/canvas-generation-failure.test.ts
          test/canvas-batch-download.test.ts
          test/canvas-text-mention.test.ts
          test/canvas-connection-state-sync.test.ts
          test/canvas-document-field-rule.test.ts
          test/canvas-unconfirmed-edits.test.ts
          test/canvas-leave-flush.test.ts
          test/canvas-personal-asset-loading.test.ts
          test/canvas-text-prompt-controls.test.ts
          test/workspace-asset-upload.test.ts
          test/assets-collection-layout.test.ts
          test/assistant-production-card.test.tsx
          test/canvas-agent-assistant-stream.test.ts
          test/image2-default-quality.test.ts
          test/script-document-import.test.ts
          test/voice-preview-player.test.ts

      - name: Build hosted web
        working-directory: web
        env:
          CANVAS_BUILD_VERSION: ${{ steps.version.outputs.value }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: bun --bun ./node_modules/vite/bin/vite.js build

      - name: Backend tests - operations
        working-directory: backend
        run: go test ./internal/operations -count=1

      - name: Backend tests - skills
        working-directory: backend
        run: go test ./internal/skills -count=1

      - name: Backend tests - canvas
        working-directory: backend
        run: go test ./internal/canvas -count=1

      - name: Backend tests - task binding
        working-directory: backend
        run: go test ./internal/taskbinding -count=1

      - name: Backend tests - agent operations
        working-directory: backend
        run: go test ./internal/agentops -count=1

      - name: Backend tests - generation
        working-directory: backend
        run: go test ./internal/generation -count=1

      - name: Backend tests - task runtime
        working-directory: backend
        run: go test ./internal/taskruntime -count=1

      - name: Backend tests - handler
        working-directory: backend
        run: go test ./internal/handler -count=1

      - name: Run focused agent host tests
        working-directory: agent-host
        run: |
          bun install --frozen-lockfile
          bun test canvas-turn.test.mjs skill-resource.test.mjs operation-policy.test.mjs operation-bridge.test.mjs

      - name: Build Linux backend
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../out
          ldflags="-s -w -X infinite-canvas/backend/internal/buildinfo.Version=${{ steps.version.outputs.value }} -X infinite-canvas/backend/internal/buildinfo.Commit=${{ github.sha }} -X infinite-canvas/backend/internal/buildinfo.BuildTime=${{ steps.version.outputs.time }}"
          go build -trimpath -ldflags="$ldflags" -o ../out/infinite-canvas-backend ./cmd/server
          chmod 0755 ../out/infinite-canvas-backend
          file ../out/infinite-canvas-backend

      - name: Package Agent Host runtime
        shell: bash
        run: |
          set -euo pipefail
          export BEEFTV_NODE_RUNTIME="$(dirname "$(dirname "$(command -v node)")")"
          node --version
          bun scripts/package-agent-host.mjs linux/amd64 out/agent-host
          tar -czf out/agent-host.tar.gz -C out/agent-host .
          tar -tzf out/agent-host.tar.gz > out/agent-host.list
          grep -Fq './runtime/bin/node' out/agent-host.list
          grep -Fq './server.mjs' out/agent-host.list

      - name: Package frontend and release bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf out/web-dist.tar.gz -C web/dist .
          go_version="$(go version | awk '{print $3}')"
          node_version="$(node --version)"
          bundle="out/aicyld-canvas-${{ steps.version.outputs.value }}-${{ steps.version.outputs.short }}.tar.gz"
          bash scripts/package-canvas-release.sh \
            --version '${{ steps.version.outputs.value }}' \
            --commit '${{ github.sha }}' \
            --build-time '${{ steps.version.outputs.time }}' \
            --go-version "$go_version" \
            --node-version "$node_version" \
            --backend out/infinite-canvas-backend \
            --web out/web-dist.tar.gz \
            --agent-host out/agent-host.tar.gz \
            --output "$bundle"
          bash scripts/deploy-canvas-release.sh "$bundle" "$(cat "$bundle.sha256")" --verify-only
          ls -lh out

      - name: Smoke-test built backend
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/backend-smoke.log"
          CANVAS_BACKEND_ADDR=127.0.0.1:18080 \
            CANVAS_BACKEND_DATA_DIR="$data_dir" \
            CANVAS_AUTO_MIGRATE=true \
            CANVAS_DISABLE_WORKERS=true \
            CANVAS_REGISTRATION_ENABLED=false \
            CANVAS_OFFICIAL_PLUGIN_DIR="$PWD/plugin-packages" \
            ./out/infinite-canvas-backend >"$log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/health.json"
          grep -q '"ready":true' "$RUNNER_TEMP/health.json"
          grep -q '${{ steps.version.outputs.value }}' "$RUNNER_TEMP/health.json"
          cleanup
          trap - EXIT
          echo "smoke=ok"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: aicyld-canvas-release-${{ steps.version.outputs.value }}-${{ steps.version.outputs.short }}
          path: |
            out/aicyld-canvas-*.tar.gz
            out/aicyld-canvas-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
